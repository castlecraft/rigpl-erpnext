{% extends "rigpl_erpnext/web.html" %}

{% block page_content %}
<div class="item-content">
	<div class="product-page-content" itemscope itemtype="http://schema.org/Product">
		<div class="row">
			<div class="col-md-6">
				{% if item.image %}
				<div class="border text-center rounded h-100 border" style="overflow: hidden;">
					<img itemprop="image" class="website-image h-100 w-100" alt="{{ item.item_name }}" src="{{ item.image }}">
				</div>
				{% endif %}
			</div>
			<div class="col-sm-6">
				<h1 itemprop="name">{{ item.item_name }}</h1>
				
				{% if item.description %}
				<div>
					<h6 class="text-uppercase text-muted">Description</h6>
					<div itemprop="description" class="item-desc">
						{{ item.description }}
					</div>
				</div>
				{% endif %}
				
				<!-- Add to cart button -->
				<div class="mt-4">
					<button class="btn btn-primary item-add-to-cart" data-item-code="{{ item.name }}">
						<i class="fa fa-shopping-cart"></i> Add to Cart
					</button>
				</div>
			</div>
		</div>
	</div>
</div>

<script>
frappe.ready(function() {
	$('.item-add-to-cart').on('click', function() {
		const item_code = $(this).data('itemCode');
		erpnext.shopping_cart.update_cart({
			item_code: item_code,
			qty: 1
		});
	});
});
</script>
{% endblock %}
